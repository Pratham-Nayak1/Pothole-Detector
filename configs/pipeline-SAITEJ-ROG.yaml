detector:
  model_path: models/detector/best.pt
  data_yaml: configs/data.yaml
  confidence: 0.18
  candidate_confidence: 0.04  # permissive candidate floor for multi-scale fusion
  class_confidence:
    3: 0.10                   # potholes: calibrated threshold after multi-scale consensus
  nms_iou: 0.65
  agnostic_nms: true
  duplicate_iou: 0.45
  duplicate_ios: 0.80
  image_size: 640
  multiscale_sizes:
  - 640
  - 800
  device: auto
severity:
  enabled: true
  model_path: models/severity/best_severity_model.pth
  image_size: 224
  confidence_threshold: 0.55
  classes:
  - low
  - medium
  - high
output:
  directory: outputs/inference
  save_images: true
  save_csv: true
  save_json: true
video:
  tracker: configs/bytetrack_pothole.yaml   # project-local tuned tracker
  severity_interval_frames: 10
  codec: mp4v
