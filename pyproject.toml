[project]
name = "road-pothole-detection-main"
version = "0.1.0"
description = "Offline road-defect detection and clip-level tracking with an optional Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics",
    "opencv-python",
    "numpy",
    "pandas",
    "matplotlib",
    "torch",
    "torchvision",
    "Pillow",
    "scikit-learn",
    "PyYAML",
    "lap>=0.5.12",
    "streamlit",
    "pytest",
    "imageio",
    "imageio-ffmpeg",
    "python-docx",
    "python-pptx",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
